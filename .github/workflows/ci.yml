name: CI

# Quoted so YAML 1.1 parsers do not read the key as boolean `true`.
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # package.json requires bun >= 1.4.0, and `bun run typecheck`
          # calls `bun check`, which only exists in current 1.4.x releases.
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One gate, the same command `npm publish` runs through `prepublishOnly`:
      # typecheck -> test -> build -> pack + tarball content validation. Keeping
      # CI and the publish hook on the same script means a green PR cannot be
      # followed by a red publish.
      - name: Release gate (typecheck, test, build, pack)
        run: bun run release:check
