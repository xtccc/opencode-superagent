name: E2E (real OpenCode host)

# This job builds and `bun pm pack`s the working tree, installs that tarball into
# an isolated HOME and boots a real OpenCode host against it. Because the packed
# tarball is exactly what `npm publish` would upload, it exercises HEAD rather
# than whatever is already on the npm registry.
#
# It stays out of `ci.yml` (fast gate) and runs on demand, or on pull requests
# that touch anything the package is built from — a `src/` change must be able to
# reach this job, otherwise the E2E can silently rot.
"on":
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "server.ts"
      - "tui.tsx"
      - "agent/**"
      - "e2e/**"
      - "script/**"
      - "test/**"
      - "tsconfig*.json"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-load:
    name: Load the tarball packed from this tree in a real host
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # package.json requires bun >= 1.4.0, and `bun run typecheck`
          # calls `bun check`, which only exists in current 1.4.x releases.
          bun-version: 1.4.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode CLI
        run: |
          # The repo targets the OpenCode v2 API: peer deps are
          # `@opencode/plugin` ^2.x and the E2E calls `/api/plugin`,
          # `/api/agent` and `/api/rpc/:id/:method`. The `opencode-ai` package
          # on npm is still the v1 line (1.19.5), so install the v2 CLI
          # package instead; its `opencode` binary serves the v2 API.
          npm install -g @opencode/cli@2.2.6
          opencode --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Builds, packs the tarball, installs it in a scratch prefix, boots a real
      # host and asserts the plugin is active and reports the package.json
      # version. Fails if HEAD does not build or pack.
      - name: Run real-host E2E against the packed tarball
        run: bun run test:e2e
